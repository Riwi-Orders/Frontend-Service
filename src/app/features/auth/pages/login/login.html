<div
  class="min-h-screen w-full flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900">
  <!-- Background decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute w-96 h-96 -top-48 -left-48 rounded-full blur-3xl opacity-30 bg-gradient-to-br from-indigo-500 to-purple-600 animate-pulse">
    </div>
    <div
      class="absolute w-80 h-80 top-1/2 -right-40 rounded-full blur-3xl opacity-30 bg-gradient-to-br from-pink-500 to-purple-600 animate-pulse"
      style="animation-delay: -5s;"></div>
    <div
      class="absolute w-72 h-72 -bottom-36 left-1/3 rounded-full blur-3xl opacity-30 bg-gradient-to-br from-cyan-500 to-indigo-500 animate-pulse"
      style="animation-delay: -10s;"></div>
  </div>

  <!-- Login Card -->
  <div
    class="w-full max-w-md relative bg-slate-900/80 backdrop-blur-xl border border-indigo-500/20 rounded-3xl p-8 shadow-2xl shadow-black/50">
    <!-- Header -->
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg shadow-indigo-500/50">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2 tracking-tight">Welcome Back</h1>
      <p class="text-slate-400 text-sm">Sign in to your account to continue</p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage()) {
    <div class="flex items-center gap-3 p-4 mb-6 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300"
      role="alert">
      <svg class="w-5 h-5 flex-shrink-0 text-red-400" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
    }

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-slate-300">Email Address</label>
        <div class="relative flex items-center">
          <svg class="absolute left-4 w-5 h-5 text-slate-500 pointer-events-none transition-colors duration-200"
            viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
          <input type="email" id="email" formControlName="email"
            class="w-full pl-12 pr-4 py-3.5 rounded-xl text-white placeholder-slate-500 bg-slate-800/50 border border-indigo-500/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200 outline-none"
            placeholder="you@example.com" autocomplete="email" />
        </div>
        @if (getFieldError('email')) {
        <p class="text-sm text-red-400 mt-1.5">{{ getFieldError('email') }}</p>
        }
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
        <div class="relative flex items-center">
          <svg class="absolute left-4 w-5 h-5 text-slate-500 pointer-events-none" viewBox="0 0 20 20"
            fill="currentColor">
            <path fill-rule="evenodd"
              d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
              clip-rule="evenodd" />
          </svg>
          <input [type]="showPassword() ? 'text' : 'password'" id="password" formControlName="password"
            class="w-full pl-12 pr-12 py-3.5 rounded-xl text-white placeholder-slate-500 bg-slate-800/50 border border-indigo-500/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200 outline-none"
            placeholder="••••••••" autocomplete="current-password" />
          <button type="button"
            class="absolute right-4 w-5 h-5 text-slate-500 hover:text-slate-300 transition-colors cursor-pointer"
            (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z"
                clip-rule="evenodd" />
              <path
                d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
            </svg>
            } @else {
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path fill-rule="evenodd"
                d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                clip-rule="evenodd" />
            </svg>
            }
          </button>
        </div>
        @if (getFieldError('password')) {
        <p class="text-sm text-red-400 mt-1.5">{{ getFieldError('password') }}</p>
        }
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer select-none">
          <input type="checkbox" formControlName="rememberMe"
            class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-0" />
          <span>Remember me</span>
        </label>
        <a href="#" class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit"
        class="w-full py-3.5 px-6 rounded-xl font-semibold text-white flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-600 shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:translate-y-0"
        [disabled]="isLoading()">
        @if (isLoading()) {
        <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
        </svg>
        <span>Signing in...</span>
        } @else {
        <span>Sign In</span>
        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
            clip-rule="evenodd" />
        </svg>
        }
      </button>
    </form>

    <!-- Divider -->
    <div class="relative flex items-center my-6">
      <div class="flex-1 h-px bg-slate-700"></div>
      <span class="px-4 text-sm text-slate-500">or continue with</span>
      <div class="flex-1 h-px bg-slate-700"></div>
    </div>

    <!-- Social Login -->
    <div class="grid grid-cols-2 gap-4">
      <button type="button"
        class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-medium text-slate-300 bg-slate-800/50 border border-indigo-500/20 hover:bg-slate-800 hover:border-indigo-500/40 hover:text-white transition-all duration-200">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        <span>Google</span>
      </button>
      <button type="button"
        class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-medium text-slate-300 bg-slate-800/50 border border-indigo-500/20 hover:bg-slate-800 hover:border-indigo-500/40 hover:text-white transition-all duration-200">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
        </svg>
        <span>GitHub</span>
      </button>
    </div>

    <!-- Register Link -->
    <p class="text-center text-sm text-slate-400 mt-6">
      Don't have an account?
      <a routerLink="/auth/register"
        class="text-indigo-400 font-semibold hover:text-indigo-300 transition-colors">Create one</a>
    </p>
  </div>
</div>
